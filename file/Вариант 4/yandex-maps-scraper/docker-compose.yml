version: "3.9"

services:
  backend:
    build:
      context: ./services/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    volumes:
      - ./services/backend:/app
      - ./data:/workspace/data
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./apps/frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

